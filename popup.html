<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playbright</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="icons/icon48.png" alt="" width="38" height="38" />
        <div>
          <h1>Playbright</h1>
          <p id="site">Current site</p>
        </div>
        <label class="switch" title="Enable on this site">
          <input id="enabled" type="checkbox" />
          <span></span>
        </label>
      </header>

      <section>
        <div class="label-row">
          <label for="reduction">Dark overlay reduction</label>
          <output id="reductionValue" for="reduction">100%</output>
        </div>
        <input id="reduction" type="range" min="0" max="100" step="5" value="100" />
        <div class="range-labels"><span>Original</span><span>Remove</span></div>
      </section>

      <section class="actions">
        <button id="scan" type="button">Rescan overlays</button>
        <button id="picker" type="button">Pick UI to hide</button>
      </section>

      <section id="presets">
        <h2>Presets</h2>
        <p id="shortcutHint" class="hint"></p>
        <form id="presetForm">
          <input id="presetName" type="text" placeholder="Preset name" maxlength="24" required />
          <button type="submit">Save</button>
        </form>
        <ul id="presetList"></ul>
      </section>

      <section class="status-card">
        <span id="statusDot"></span>
        <p id="status">Ready</p>
      </section>

      <button id="reset" class="text-button" type="button">Reset hidden elements for this site</button>
      <p id="tip" class="hint" hidden>
        Playbright is free. If it helps, <a class="tip-link" target="_blank" rel="noopener">buy me a coffee ☕</a>
      </p>
      <p class="hint">Tip: start video playback before rescanning. Press Esc to cancel the picker.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
